<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="custom-bg">
    <header class="text-white text-center my-4">
        <h1>Analisador de Números</h1>
    </header>

    <main class="container">
        <section class="card shadow p-4">
            <div class="card-body">
                <div class="mb-3">
                    <label for="fnum" class="form-label">Número entre (1 e 100):</label>
                    <div class="input-group">
                        <input type="number" class="form-control" name="fnum" id="fnum" placeholder="Digite um número">
                        <input type="button" class="btn btn-primary" value="Adicionar" onclick="adicionar()">
                    </div>
                </div>
                <div class="mb-3">
                    <select class="form-select" name="flista" id="flista" size="6"></select>
                </div>
                <input type="button" class="btn btn-success" value="Finalizar" onclick="finalizar()">
                <div id="res" class="mt-3">
                </div>
            </div>
        </section>
    </main>

    <footer class="text-white text-center mt-4">
        <p>&copy; Dylinha</p> 
    </footer>
    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lG5eD9lQ1hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHND" crossorigin="anonymous"></script>
</body>
</html>
