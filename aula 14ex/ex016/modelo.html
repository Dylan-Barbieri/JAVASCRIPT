<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="bg-light">
    <div class="container mt-5">
        <header class="text-center">
            <h1>Vamos Contar</h1>
        </header>
        <main class="card shadow-sm mt-4">
            <div class="card-body">
                <div class="row">
                    <div id="dados" class="col-md-6">
                        <div class="mb-3">
                            <label for="txti" class="form-label">Início:</label>
                            <input type="number" name="início" id="txti" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="txtf" class="form-label">Fim:</label>
                            <input type="number" name="fim" id="txtf" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="txtp" class="form-label">Passo:</label>
                            <input type="number" name="passo" id="txtp" class="form-control">
                        </div>
                        <input type="button" value="Contar" onclick="contar()" class="btn btn-primary w-100">
                    </div>
                    <div id="res" class="col-md-6 mt-4 mt-md-0">
                        Preparando a contagem...
                    </div>
                </div>
            </div>
        </main>
        <footer class="text-center mt-4 text-muted">
            <p>&copy; Dylinha</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
